<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, 'fetch') ||
            Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && desc.configurable && (!desc.writable && !desc.set)) {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
            });
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = String((event && event.message) || '');
            var file = String((event && event.filename) || '');
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return false;
            }
          },
          true
        );
      })();
    </script>
